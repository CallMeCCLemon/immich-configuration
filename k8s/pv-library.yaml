# Static PersistentVolume for Immich's photo/video library.
#
# This deviates from the generic dynamically-provisioned pattern used by
# k8s/templates/pvc.yaml. server0's root disk (a 100Gi LVM volume) is too
# small for the library, so this PV is pinned to server0 and backed by
# /mnt/data/immich-library, a directory on a separate 1.7Ti LVM array
# already mounted there. It is hand-maintained, not generated by
# `make generate-k8s` — do not delete this comment if you edit it.
#
# k8s/pvc.yaml binds to this PV by name (spec.volumeName) instead of
# requesting dynamic provisioning from the local-path StorageClass.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-bulk
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /mnt/data/immich-library
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - server0
