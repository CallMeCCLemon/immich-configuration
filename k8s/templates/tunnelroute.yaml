# Auto-generated from k8s/templates/tunnelroute.yaml
# Edit project.yaml and run 'make generate-k8s' to regenerate. Do not edit by hand.
#
# Publishes ${PUBLIC_DOMAIN} through the cluster's shared Cloudflare tunnel
# (ClusterTunnel "${TUNNEL_NAME}", managed by Cloudflare-Tunnel-Operator). The
# operator adds the hostname to the tunnel's config and creates the proxied DNS
# record, so there is no cloudflared Deployment, tunnel token, or dashboard step.
#
# immich-server is created by the Helm release, so on a fresh install this route
# reports ServiceNotFound until `make helm-deploy` has run, then goes Ready.
#
# Check it with: kubectl -n ${NAMESPACE} get tunnelroute immich
apiVersion: tunnels.latentlab.cc/v1alpha1
kind: TunnelRoute
metadata:
  name: immich
  namespace: ${NAMESPACE}
spec:
  tunnelRef:
    name: ${TUNNEL_NAME}
  hostname: ${PUBLIC_DOMAIN}
  service:
    name: immich-server
    port: 2283
  # true lets the operator take over a DNS record it didn't create, e.g. one left
  # by a dashboard-managed tunnel. Only needed for the first apply after migrating.
  adoptExistingDnsRecord: ${TUNNEL_ADOPT_DNS}
