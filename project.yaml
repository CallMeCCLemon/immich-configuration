# project.yaml — single source of truth for all project-specific configuration.
#
# After editing:
#   1. Run `make generate-k8s` to regenerate the k8s manifests from k8s/templates/.
#   2. Review `git diff k8s/` and commit.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Cluster ───────────────────────────────────────────────────────────────────

# namespace: the k8s namespace where all Immich resources are deployed.
namespace: immich

# ── Public Access ─────────────────────────────────────────────────────────────

# public_domain: the public hostname served via the cluster's shared Cloudflare
#   tunnel. k8s/tunnelroute.yaml asks Cloudflare-Tunnel-Operator to route it to
#   http://immich-server.<namespace>:2283 and to manage its proxied DNS record.
#   No dashboard setup or tunnel token is needed.
public_domain: photos.latentlab.cc

# tunnel_name: the ClusterTunnel (cluster-scoped, run by Cloudflare-Tunnel-Operator)
#   this hostname attaches to. Every project on the cluster shares "home".
tunnel_name: home

# tunnel_adopt_dns: set to true when public_domain already has a DNS record the
#   operator didn't create (for example one left by an old dashboard-managed
#   tunnel), so the operator may take it over. Set it back to false once the
#   TunnelRoute is Ready: the record is then marked as operator-managed.
tunnel_adopt_dns: false

# ── Storage ───────────────────────────────────────────────────────────────────

# library_storage_size: size of the PVC for Immich's photo/video library.
#   This PVC is pre-created (immich.persistence.library.existingClaim in values/).
#   NOTE: on this cluster the library PVC is hand-bound to a static PV
#   (see k8s/pv-library.yaml) because server0's root disk is too small.
#   Running `make generate-k8s` will overwrite that binding in k8s/pvc.yaml —
#   check the diff before committing. Keep this value in sync with the
#   `storage:` requested in k8s/pvc.yaml regardless.
library_storage_size: 300Gi

# db_storage_size: size of the PVC for the CloudNativePG PostgreSQL cluster.
db_storage_size: 8Gi
